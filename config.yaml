# All settings in one place (script name in brackets). Paths are relative to the project root
# (the folder holding this file); scripts read them with gold_dl.config.path("key").

paths:
  raw_mbp1: GC_mbp1                       # [databento_gc_mbp1.py]
  mbp1_batch: GC_mbp1/GLBX-20261025-PT9C6P3YKJ   # downloaded MBP-1 job [process_gc_mbp1.py, build_gc_*_1min.py]
  raw_ohlcv1m: GC_ohlcv1m_1year.dbn.zst   # [databento_gc_ohlcv1m.py]
  ohlcv1m_csv: GC_1min_1year.csv          # [databento_gc_ohlcv1m.py]
  spot_xauusd: XAUUSD_1min_1year.csv      # discarded spot data, section 2 only [section2_data_quality.py]
  processed: GC_processed                 # [build_gc_*_1min.py]
  features: features                      # [build_features.py]
  labels: labels                          # [make_labels.py]
  model_arrays: model_data/model_arrays.npz   # [export_model_arrays.py]
  notes: 数据说明
  databento_key: databento_key.txt        # not committed
  twelvedata_key: twelvedata_key.txt      # not committed; discarded spot data only [fetch_xauusd.py]

data:
  dataset: GLBX.MDP3           # [databento_gc_mbp1.py, databento_gc_ohlcv1m.py]
  symbol: GC.v.0
  start: "2025-09-28"          # download start date, inclusive (quoted so YAML keeps it a string)
  end: "2026-09-29"            # download end date, exclusive
  tick: 0.1                    # USD per tick [gold_dl/labels.py, build_features.py, build_gc_book_1min.py, build_gc_spread_tw_1min.py]

cleaning:
  max_fill_gap_min: 30         # fill intraday gaps of up to 30 minutes [build_features.py]
  quote_ffill_limit_min: 10    # carry the last quote forward for at most 10 minutes [gold_dl/labels.py]
  pre_roll_days: 3             # no samples in the 3 days before a roll [build_features.py, gold_dl/labels.py]
                               # the label column is called pre_roll (no number); the value used is saved in run_config_*.yaml
  wide_spread_mult: 5          # extreme spread = 5 x training median (20 ticks) [gold_dl/labels.py]

split:                         # by time, in order [gold_dl/labels.py; build_features.py uses train_frac and gap_min]
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15              # the rest after train and val; checked to sum to 1
  gap_min: 60                  # minutes removed at each boundary, at least the longest holding period

labels:                        # triple barrier [gold_dl/labels.py, save_default_labels.py, export_model_arrays.py]
  holding_min: [15, 30, 60]
  base_holding_min: 15         # k_SL and rr are defined on this horizon; other horizons scale the stop by sqrt(H / base)
  atr_period: 14               # [build_features.py] label stop/target distance AND the denominator of d_*, ma_dist_*,
                               # ret_*, atr_rel, spread_atr; the column is called raw_atr (no number)
  k_sl_grid: [1, 1.5, 2, 3]
  rr_grid: [1, 1.5, 2]
  default_k_sl: 2              # combination exported to labels_default.parquet [save_default_labels.py]
  default_rr: 1
  m4_min_class_share: 0.15     # candidate combinations for M4 (not used by any script yet)
  cost_per_side_usd: 2.52      # 1.65 exchange + 0.02 NFA + 0.85 commission, per contract (100 oz) [gold_dl/labels.py]

features:                      # [transform_tail_features.py, standardize_features.py, export_model_arrays.py]
  log_then_clip: [spread_atr, relvol_60, atr_rel, vol_ratio_5_60]
  clip_only: [ofi_depth_adj, d_open, d_high, d_low]
  keep_as_is: [dow_mon, dow_tue, dow_wed, dow_thu, dow_fri, sess_london, sess_ny, sess_overlap, sess_asia, tod_sin, tod_cos]

report:                        # figures and checks [plot_eda_figures.py, section7_checks.py, check_monthly_sl_drift.py]
  focus_holding_min: 30        # holding period shown in the single-horizon figures and checks; must be in labels.holding_min

pipeline:                      # [gold_dl/data_pipeline.py; lookback also export_model_arrays.py]
  lookback: 60
  batch_size: 256

training:
  seed: 42                     # [gold_dl/data_pipeline.py]
  max_epochs: 30               # for M4 training (not used by any script yet)
  mixed_precision: true        # for M4 training (not used by any script yet)
